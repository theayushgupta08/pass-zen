# PassZen — GitHub Actions CI/CD
# Automatically builds installers for Windows, macOS, and Linux
# on every tagged release (e.g., v1.0.0) or manual trigger via GitHub Actions tab.

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────
  #  Windows Build
  # ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build executable
        run: python build.py

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/windows/passzen_installer.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PassZen-Windows
          path: |
            installer/windows/Output/PassZen-Setup.exe
            dist/PassZen.exe

  # ────────────────────────────────────────────────────────────────
  #  macOS Build
  # ────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build app bundle
        run: python build.py

      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "PassZen" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "PassZen.app" 175 190 \
            --app-drop-link 425 190 \
            "dist/PassZen.dmg" \
            "dist/PassZen.app" || true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: PassZen-macOS
          path: dist/PassZen.dmg

  # ────────────────────────────────────────────────────────────────
  #  Linux Build
  # ────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libfuse2 || true

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build executable
        run: python build.py

      - name: Create AppImage
        run: |
          mkdir -p PassZen.AppDir/usr/bin
          mkdir -p PassZen.AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/PassZen PassZen.AppDir/usr/bin/
          cp installer/linux/passzen.desktop PassZen.AppDir/

          # Copy icon
          if [ -f assets/icon.png ]; then
            cp assets/icon.png PassZen.AppDir/passzen.png
            cp assets/icon.png PassZen.AppDir/usr/share/icons/hicolor/256x256/apps/passzen.png
          fi

          # Create AppRun
          cat > PassZen.AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/PassZen" "$@"
          EOF
          chmod +x PassZen.AppDir/AppRun

          # Download and extract appimagetool (extract bypasses FUSE requirement in CI)
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

          # Build AppImage without needing FUSE
          ARCH=x86_64 ./squashfs-root/AppRun PassZen.AppDir dist/PassZen.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PassZen-Linux
          path: |
            dist/PassZen.AppImage
            dist/PassZen

  # ────────────────────────────────────────────────────────────────
  #  Create GitHub Release
  # ────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PassZen ${{ github.ref_name || 'v1.0.0' }}
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## 🔐 PassZen ${{ github.ref_name || 'v1.0.0' }}

            ### Downloads
            | Platform | File | Description |
            |---|---|---|
            | **Windows** | `PassZen-Setup.exe` | Setup Wizard (Desktop icon + Start Menu + Uninstaller) |
            | **Windows** | `PassZen.exe` | Portable Executable (No installation required) |
            | **macOS** | `PassZen.dmg` | Drag-and-Drop Disk Image |
            | **Linux** | `PassZen.AppImage` | Universal Linux Package |
            | **Linux** | `PassZen` | Standalone Linux Binary |

            ### Notes
            - **Zero Python installation required** to run any of the binaries above.
            - All data is encrypted locally using **AES-256-GCM**.
          files: |
            release-artifacts/PassZen-Windows/*
            release-artifacts/PassZen-macOS/*
            release-artifacts/PassZen-Linux/*
          draft: false
          prerelease: false
